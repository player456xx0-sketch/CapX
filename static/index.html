<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CapX: Fast Caption Generator</title>
<meta name="theme-color" content="#0e0e10">
<style>
:root{--bg:#0e0e10;--card:#17171a;--bd:#2a2a2f;--tx:#f4f4f5;--mu:#8b8b94;--ac:#e8b04b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:28px 20px}
h1{margin:0;font-size:30px;letter-spacing:-.5px}h1 b{color:var(--ac)}.sub{color:var(--mu);margin:4px 0 24px}
.drop{display:block;border:1.5px dashed var(--bd);border-radius:16px;padding:34px 16px;text-align:center;background:var(--card);cursor:pointer;transition:.2s}
.drop:hover,.drop.on{border-color:var(--ac)}.drop small{color:var(--mu)}
video{width:100%;border-radius:12px;margin-top:14px;background:#000;max-height:60vh}
.langs{display:flex;gap:8px;margin:20px 0}.langs button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:17px;cursor:pointer}
.langs button.sel{border-color:var(--ac);color:var(--ac)}
.go{width:100%;padding:15px;border:0;border-radius:12px;background:var(--ac);color:#111;font-size:17px;font-weight:600;cursor:pointer}
.go:disabled{opacity:.4}.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin:14px 0 8px}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:.4s}
.err{color:#ff7a7a;margin-top:12px}.hide{display:none}a.go{display:block;text-align:center;text-decoration:none;margin-top:14px}
.ghost{background:none;border:0;color:var(--mu);margin-top:14px;cursor:pointer;width:100%}
</style></head><body><main>
<h1>Cap<b>X</b></h1><p class="sub">Fast Caption Generator</p>
<div id="up">
<label class="drop" id="drop"><input id="f" type="file" accept="video/*" hidden>
<div id="dt">Video yahan drop karo ya tap karo<br><small>MP4, MOV, MKV, WEBM · max 200MB</small></div></label>
<video id="pv" class="hide" controls playsinline></video>
<div class="langs" id="ls"><button data-l="en" class="sel">English</button><button data-l="hi">हिंदी</button><button data-l="ur">اردو</button></div>
<button class="go" id="gen" disabled>Generate Captions</button>
</div>
<div id="pr" class="hide"><div class="bar"><i id="pb"></i></div><div id="st">...</div></div>
<div id="rs" class="hide"><video id="rv" controls playsinline></video><a class="go" id="dl">Download MP4</a><button class="ghost" onclick="location.reload()">Naya video</button></div>
<div class="err" id="er"></div>
</main><script>
const $=id=>document.getElementById(id);let file=null,lang='en';
function pick(x){if(!x)return;if(!x.type.startsWith('video/')){$('er').textContent='Sirf video file chuno';return}
if(x.size>200*1048576){$('er').textContent='File 200MB se badi hai';return}
$('er').textContent='';file=x;$('dt').textContent=x.name;$('pv').src=URL.createObjectURL(x);$('pv').classList.remove('hide');$('gen').disabled=false}
$('f').onchange=e=>pick(e.target.files[0]);
const dr=$('drop');dr.ondragover=e=>{e.preventDefault();dr.classList.add('on')};dr.ondragleave=()=>dr.classList.remove('on');
dr.ondrop=e=>{e.preventDefault();dr.classList.remove('on');pick(e.dataTransfer.files[0])};
document.querySelectorAll('#ls button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#ls button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');lang=b.dataset.l});
$('gen').onclick=()=>{$('up').classList.add('hide');$('pr').classList.remove('hide');$('st').textContent='Upload ho raha hai...';
const fd=new FormData();fd.append('file',file);fd.append('lang',lang);
const x=new XMLHttpRequest();x.open('POST','/api/upload');
x.upload.onprogress=e=>{if(e.lengthComputable)$('pb').style.width=(e.loaded/e.total*8)+'%'};
x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(_){}if(x.status!=200)return fail(j.detail||'Upload fail');poll(j.id)};
x.onerror=()=>fail('Network error');x.send(fd)};
function fail(m){$('er').textContent=m;$('pr').classList.add('hide');$('up').classList.remove('hide')}
async function poll(id){try{const s=await(await fetch('/api/status/'+id)).json();
if(s.error)return fail(s.error);$('pb').style.width=s.progress+'%';$('st').textContent=s.status;
if(s.done){$('pr').classList.add('hide');$('rs').classList.remove('hide');$('rv').src='/api/video/'+id;$('dl').href='/api/video/'+id+'?dl=1';return}}catch(e){}
setTimeout(()=>poll(id),1500)}
</script></body></html>
